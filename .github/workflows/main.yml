name: Build macOS Intel

on:
  workflow_dispatch:

jobs:
  build-intel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Intel (x86_64) on Apple Silicon runner
        run: |
          xcodebuild -project NovaController/NovaController.xcodeproj \
            -scheme NovaController \
            -configuration Release \
            -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            VALID_ARCHS=x86_64 \
            clean build \
            BUILD_DIR=build

      - name: Zip App
        run: |
          cd build/Release
          zip -r NovaController-Intel.zip NovaController.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NovaController-Intel-macOS-15
          path: build/Release/NovaController-Intel.zip
