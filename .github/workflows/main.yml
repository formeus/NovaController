name: Build macOS Intel

on:
  workflow_dispatch:

jobs:
  build-intel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Intel x86_64
        run: |
          xcodebuild -project NovaController/NovaController.xcodeproj \
            -scheme NovaController \
            -configuration Release \
            -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            clean build

      - name: Zip
        run: |
          cd build
          zip -r -y NovaController-Intel.zip NovaController.app || true
          mv NovaController-Intel.zip ../
          cd ..
          ls -lh *.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NovaController-Intel
          path: NovaController-Intel.zip
